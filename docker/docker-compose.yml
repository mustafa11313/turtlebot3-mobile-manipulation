# GUI (Gazebo client, RViz) is forwarded to the host's X server.
# On the host, once per login:   xhost +local:docker
# NVIDIA GPU (e.g. HP ZBook with Quadro/RTX): install nvidia-container-toolkit and
# use the "sim-nvidia" service instead of "sim".
services:
  sim:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: tb3-fetch-deliver:humble
    network_mode: host
    ipc: host
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ../:/ws/src/turtlebot3-fetch-deliver:rw
      - ../results:/ws/results:rw
    devices:
      - /dev/dri:/dev/dri
    stdin_open: true
    tty: true

  sim-nvidia:
    extends: sim
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - __NV_PRIME_RENDER_OFFLOAD=1
      - __GLX_VENDOR_LIBRARY_NAME=nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
